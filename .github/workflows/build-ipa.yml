name: Build TrollStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skincare-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, build and publish IPA
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      APP_VERSION: 1.0.0
      BUILD_NUMBER: ${{ github.run_number }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run checks and build the TrollStore package
        run: bash scripts/build_ipa.sh

      - name: Add validation summary
        run: cat build/artifacts/test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release attachments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          assets=(
            "build/artifacts/SkincareInventory-${APP_VERSION}-TrollStore.ipa"
            "build/artifacts/SHA256SUMS.txt"
            "build/artifacts/validation.json"
            "build/artifacts/test-report.md"
            "build/artifacts/simulator-evidence.zip"
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
            if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::The existing release tag points to another commit. Increase APP_VERSION before publishing changed source."
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "库存手记 ${APP_VERSION} · TrollStore" \
              --notes-file build/artifacts/test-report.md
          fi
