name: Build TrollStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skincare-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_VERSION: 1.0.0
  BUILD_NUMBER: ${{ github.run_number }}
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  test:
    name: Validate scripts and iOS simulator
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run script, native and UI tests
        run: bash scripts/build_ipa.sh test

      - name: Keep failed simulator diagnostics for one day
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulator-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/diagnostics
          if-no-files-found: ignore
          retention-days: 1

      - name: Hand successful test evidence to the build job
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulator-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/artifacts/simulator-evidence.zip
            build/artifacts/handoff-manifest.json
          if-no-files-found: error
          retention-days: 1
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}

  build:
    name: Build and publish verified IPA
    needs: test
    runs-on: macos-15-intel
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download this run's successful simulator evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: simulator-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/artifacts

      - name: Verify test evidence and build the TrollStore package
        run: bash scripts/build_ipa.sh build

      - name: Add validation summary
        run: cat build/artifacts/test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release attachments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          assets=(
            "build/artifacts/SkincareInventory-${APP_VERSION}-TrollStore.ipa"
            "build/artifacts/SkincareInventory-${APP_VERSION}-source.zip"
            "build/artifacts/SHA256SUMS.txt"
            "build/artifacts/validation.json"
            "build/artifacts/test-report.md"
            "build/artifacts/simulator-evidence.zip"
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
            if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::The existing release tag points to another commit. Increase APP_VERSION before publishing changed source."
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "库存手记 ${APP_VERSION} · TrollStore" \
              --notes-file build/artifacts/test-report.md \
              --draft=false --latest
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "库存手记 ${APP_VERSION} · TrollStore" \
              --notes-file build/artifacts/test-report.md
          fi

      - name: Delete temporary test evidence after release publication
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ARTIFACT_ID: ${{ needs.test.outputs.artifact-id }}
        shell: bash
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}"
